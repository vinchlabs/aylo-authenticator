[package]
name = "authenticator"
version = "0.1.0"
edition = "2024"
links = "authenticator"

[build-dependencies]
color-eyre.workspace = true
xbuild.workspace = true

[dependencies]
crypto.workspace = true
io.workspace = true
models.workspace = true
rtl.workspace = true
sec.workspace = true
sys.workspace = true
trezor_lib.workspace = true
upymod = { workspace = true, default-features = false }

[features]
# No `sec/storage` and no `trezor_lib/storage`. Ordinary storage owned
# STORAGE_AREAS[0] and STORAGE_AREAS[1]; the vault now owns their raw bytes as
# replicas 0 and 1, so NORCOW is not a co-tenant here, it is a writer into vault
# territory. audit_image.py refuses any artifact where its symbols reappear.
default = [
    "io/authenticator",
    # Header and syscall stub only; the driver itself is compiled into the
    # kernel, which is the side allowed to touch a pin.
    "io/auth_presence",
    "io/usb_iface_webauthn",
    "crypto/aes_gcm",
    "trezor_lib/crypto",
    "trezor_lib/authenticator",
    "trezor_lib/usb",
    "upymod/authenticator",
    "upymod/frozen",
]
emulator = ["io/emulator", "trezor_lib/emulator", "upymod/emulator", "io/kernel_mode", "io/secure_mode", "sys/applets"]
bootloader_devel = ["sec/bootloader_devel"]
production = ["io/production"]
authenticator_test_presence = ["upymod/authenticator_test_presence"]
authenticator_assumed_presence = ["upymod/authenticator_assumed_presence"]
authenticator_test_backend = ["upymod/authenticator_test_backend"]
authenticator_integration_credentials = []
optiga = ["sec/optiga", "upymod/optiga", "trezor_lib/optiga"]
secret = ["sec/secret"]
secure_aes = ["sec/secure_aes"]
secure_mode = ["io/secure_mode"]
hash_processor = ["sec/hash_processor"]
tamper = ["sec/tamper"]
mcu_stm32u58 = ["io/mcu_stm32u58", "upymod/mcu_stm32u58", "mcu_stm32u5"]
mcu_stm32u5 = ["sec/trustzone"]
