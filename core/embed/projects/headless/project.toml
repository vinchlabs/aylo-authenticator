# Reuse prodtest's coherent model feature graph for STM32U5 support while
# keeping a headless-only source allowlist in build.rs. Compiling a component
# does not initialize it; main.c must remain limited to USB VCP and CLI.
uses = [
    "backlight",
    "backup_ram",
    "ble",
    "boot_ucb",
    "button",
    "consumption_mask",
    "display",
    "display_mono",
    "display_rgb565",
    "display_rgba8888",
    "dma2d",
    "framebuffer",
    "haptic",
    "hash_processor",
    "hw_revision",
    "iwdg",
    "layout_bolt",
    "layout_caesar",
    "layout_delizia",
    "layout_eckhart",
    "lockable_bootloader",
    "mcu_attestation",
    "nfc",
    "nrf",
    "optiga",
    "power_manager",
    "pvd",
    "rgb_led",
    "rtc",
    "sbu",
    "sd_card",
    "sdram",
    "secret",
    "secmon_header",
    "secure_aes",
    "smp",
    "suspend",
    "tamper",
    "telemetry",
    "touch",
    "touch_wakeup",
    "tropic",
]
elf_sections = [".vendorheader", ".header", ".flash", ".data"]

[build-options]
bootloader-devel = { true = ["bootloader_devel"] }
